---
layout: default
---

<main class="hero">
    <h1 class="visually-hidden">Mike Pinnell</h1>
    <ul class="social">
        {% for network in site.social %}
        <li>
            <a href="{{ network.url }}" target="_blank" rel="noopener" aria-label="{{ network.name }}" title="{{ network.name }}">
                {% include icons/{{ network.icon }}.svg %}
            </a>
        </li>
        {% endfor %}
    </ul>
</main>
