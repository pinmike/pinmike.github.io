url: https://github.pinmike.io
baseurl: ""

# Site settings
title: github.pinmike.io
description: "Pinmike's Github Pages, powered by Github and Jekyll."

# Links in the top navigation bar
nav:
  - name: LinkedIn
    url: https://uk.linkedin.com/in/mikepinnell
  - name: GitHub
    url: https://github.com/pinmike

# Social links shown on the home page.
# `icon` matches a file in _includes/icons (from https://simpleicons.org, CC0).
social:
  - name: LinkedIn
    icon: linkedin
    url: https://www.linkedin.com/in/mikepinnell
  - name: GitHub
    icon: github
    url: https://github.com/pinmike

# Build settings
markdown: kramdown
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - "*.sublime-*"
